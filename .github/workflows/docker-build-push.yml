name: Docker Build and Push (reusable)

on:
  workflow_call:
    inputs:
      image-name:
        description: Full image name, e.g. youruser/demo-app
        required: true
        type: string
      image-tag:
        description: Tag to apply
        required: true
        type: string
      artifact-name:
        description: Build artifact containing the jar
        required: false
        type: string
        default: app-jar
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      image-ref:
        description: Full image reference that was pushed
        value: ${{ jobs.docker.outputs.image-ref }}

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.ref.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar built earlier
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: target

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ inputs.image-name }}:${{ inputs.image-tag }}
            ${{ inputs.image-name }}:latest

      - name: Expose image reference
        id: ref
        run: echo "image-ref=${{ inputs.image-name }}:${{ inputs.image-tag }}" >> "$GITHUB_OUTPUT"