name: CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Maven build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/demo-app-*.jar

  sonar-scan:
    name: SonarQube scan
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sonar composite action
        uses: ./.github/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          project-key: SpaceHimalayas_java-ci
          organization: sonargithubspace

  docker-build-push:
    name: Docker build and push
    needs: [build-test, sonar-scan]
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image-name: sucharithareddyr6724/demo-app
      image-tag: ${{ github.sha }}
    secrets: inherit

  trivy-scan:
    name: Trivy image scan
    needs: docker-build-push
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-ref: sucharithareddyr6724/demo-app:${{ github.sha }}
      severity-threshold: CRITICAL

  jfrog-publish-scan:
    name: JAR to JFrog and Xray scan
    needs: trivy-scan
    runs-on: ubuntu-latest
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Check connection
        run: jf rt ping

      - name: Upload jar to Artifactory
        run: |
          jf rt upload "target/demo-app-*.jar" \
            "maven-local/com/example/demo-app/1.0.0/" --flat=true

      - name: Xray scan of the jar
        run: jf scan "target/demo-app-*.jar"